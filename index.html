<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ลูมิน่า (Lumina) — เลขา AI ส่วนตัว</title>
  <link rel="manifest" href="./manifest.json" />
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 18px 16px 24px;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .title h1 { font-size: 1.15rem; font-weight: 700; }
    .title p { font-size: 0.76rem; color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      cursor: pointer;
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: rgba(17, 24, 39, 0.7);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .tab.active {
      background: #1d4ed8;
      color: #fff;
    }
    .panel { display: none; flex-direction: column; gap: 14px; flex: 1; }
    .panel.active { display: flex; }

    .call-stage {
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }
    .orb {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb 60%, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }
    .orb.calling {
      animation: pulse 1.8s infinite;
      background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a 60%, #14532d);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70% { box-shadow: 0 0 0 22px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .status-text { font-size: 1rem; font-weight: 600; }
    .sub-status { font-size: 0.8rem; color: var(--muted); }
    .controls { display: flex; gap: 10px; justify-content: center; }
    button {
      border: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-call { background: var(--green); color: #052e16; padding: 13px 28px; min-width: 170px; }
    .btn-hangup { background: var(--red); color: #fff; padding: 13px 28px; min-width: 170px; }
    .btn-secondary { background: #1f2937; color: var(--text); padding: 13px 16px; }
    .btn-secondary.muted { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

    .log-card {
      flex: 1;
      background: rgba(17, 24, 39, 0.65);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 220px;
      max-height: 46dvh;
    }
    .log-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.45;
      max-width: 88%;
      word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #1d4ed8; color: #eff6ff; }
    .msg.assistant { align-self: flex-start; background: #1f2937; color: var(--text); }
    .msg.tool {
      align-self: center; max-width: 100%; font-size: 0.78rem; text-align: center;
      background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.3); color: #bbf7d0;
    }
    .msg.error {
      align-self: center; max-width: 100%; font-size: 0.8rem;
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fecaca;
    }
    .text-bar { display: flex; gap: 8px; }
    .text-bar input {
      flex: 1; background: #0f172a; border: 1px solid var(--border); border-radius: 999px;
      padding: 10px 14px; color: var(--text); font-size: 0.86rem; outline: none;
    }
    .text-bar button { background: var(--blue); color: #fff; padding: 10px 16px; font-size: 0.84rem; }

    .note-card {
      background: rgba(17, 24, 39, 0.82);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .note-card h3 { font-size: 0.95rem; }
    .note-meta { font-size: 0.74rem; color: var(--muted); }
    .note-body {
      font-size: 0.82rem;
      white-space: pre-wrap;
      color: #d1d5db;
      max-height: 160px;
      overflow-y: auto;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
    }
    .note-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .note-actions button {
      font-size: 0.76rem;
      padding: 7px 12px;
      background: #1f2937;
      color: var(--text);
    }
    .note-actions button.primary { background: #2563eb; color: #fff; }
    .note-actions button.danger { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
    .empty { text-align: center; color: var(--muted); padding: 32px 12px; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <h1>ลูมิน่า (Lumina)</h1>
        <p>Cloud 24 ชม. • ไม่ต้องเปิดคอม</p>
      </div>
      <span id="keyBtn" class="badge">🔑 ตั้งค่า API Key</span>
    </header>

    <div class="tabs">
      <button id="tabCall" class="tab active">📞 โทรคุย</button>
      <button id="tabNotes" class="tab">📝 บันทึกที่เก็บไว้ (<span id="notesCount">0</span>)</button>
    </div>

    <div id="panelCall" class="panel active">
      <section class="call-stage">
        <div id="orb" class="orb">✨</div>
        <div id="statusText" class="status-text">ลูมิน่าพร้อมรับสายค่ะ</div>
        <div id="subStatus" class="sub-status">โทรคุยและสรุปงานได้ตลอด 24 ชม. แม้ปิดคอม</div>
        <div class="controls">
          <button id="callBtn" class="btn-call">📞 โทรหาลูมิน่า</button>
          <button id="muteBtn" class="btn-secondary" style="display:none;">🔇 ปิดไมค์</button>
        </div>
      </section>

      <section class="log-card">
        <div id="logList" class="log-list">
          <div class="msg tool">กด "📞 โทรหาลูมิน่า" เพื่อเริ่มคุยหรือสรุปงานได้เลยค่ะ (ทุกอย่างจะถูกบันทึกอัตโนมัติ)</div>
        </div>
        <form id="textForm" class="text-bar">
          <input id="textInput" type="text" placeholder="พิมพ์ข้อความเสริมระหว่างโทรได้..." disabled />
          <button id="sendBtn" type="submit" disabled>ส่ง</button>
        </form>
      </section>
    </div>

    <div id="panelNotes" class="panel">
      <div id="notesList" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <script src="./app.js?v=3"></script>
</body>
</html>
